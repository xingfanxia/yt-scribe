<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scribe</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="head">
      <img src="../../icons/icon48.png" alt="" width="36" height="36" />
      <h1><span>Scribe</span> <span class="muted" data-i18n="settings"></span></h1>
    </header>

    <main>
      <p class="muted hint lead" data-i18n="optionsLead"></p>

      <section>
        <h2 data-i18n="secShortcuts"></h2>
        <p class="muted hint" id="shortcutHint"></p>
        <button id="shortcutsBtn" class="btn small" data-i18n="changeShortcuts"></button>
      </section>

      <section>
        <h2 data-i18n="secAi"></h2>
        <p class="muted hint" data-i18n="aiHint"></p>
        <form id="aiForm" class="grid">
          <label for="provider" data-i18n="provider"></label>
          <select id="provider" class="field">
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai" data-i18n="openaiCompatible"></option>
          </select>
          <label for="apiKey" data-i18n="apiKey"></label>
          <input id="apiKey" class="field" type="password" autocomplete="off" spellcheck="false" />
          <label for="model" data-i18n="model"></label>
          <input id="model" class="field" list="modelList" spellcheck="false" />
          <datalist id="modelList"></datalist>
          <label for="baseUrl" data-i18n="baseUrl"></label>
          <input id="baseUrl" class="field" type="url" spellcheck="false" />
          <label for="effort" id="effortLabel" data-i18n="effort"></label>
          <select id="effort" class="field">
            <option value="low" data-i18n="effortLow"></option>
            <option value="medium" data-i18n="effortMedium"></option>
            <option value="high" data-i18n="effortHigh"></option>
          </select>
          <div class="span actions">
            <button class="btn primary" type="submit" data-i18n="saveAi"></button>
            <button class="btn" type="button" id="testAi" data-i18n="testConnection"></button>
            <span id="aiStatus" class="muted" role="status"></span>
          </div>
        </form>
      </section>
    </main>

    <script src="../shared/core.js"></script>
    <script src="../shared/dom.js"></script>
    <script src="../shared/store.js"></script>
    <script src="../shared/ai.js"></script>
    <script src="options.js"></script>
  </body>
</html>
